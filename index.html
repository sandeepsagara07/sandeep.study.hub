<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sandeep Study Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12142B">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12142B;
    --paper:#F1F4FB;
    --paper-card:#FFFFFF;
    --line:#DFE4F2;
    --text:#1B1D2E;
    --text-muted:#6B7089;
    --accent:#5B5FEF;
    --tab-code:#2F7DE1;
    --tab-ai:#A855F7;
    --tab-data:#0EA5A0;
    --tab-struct:#E29321;
    --tab-db:#EF4770;
    --radius:16px;
    --shadow:0 6px 20px rgba(18,20,43,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;}
  img{max-width:100%;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .site-header{background:var(--ink);color:#fff;}
  .header-inner{
    max-width:960px;margin:0 auto;padding:18px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;
    font-size:.68rem;color:rgba(255,255,255,.55);display:block;
  }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;font-size:clamp(1.25rem,4vw,1.6rem);
    letter-spacing:-0.01em;margin-top:2px;
  }
  .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .visits-badge{
    font-family:'JetBrains Mono',monospace;font-size:.78rem;background:rgba(255,255,255,.08);
    padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  body.is-admin .site-header{box-shadow:inset 0 -3px 0 var(--accent);}

  .btn{
    font-weight:600;border-radius:10px;padding:10px 16px;border:none;cursor:pointer;
    font-size:.88rem;transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  }
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(91,95,239,.35);}
  .btn.primary:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--text);text-decoration:underline;padding:8px 10px;}
  .btn.outline{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;}
  .btn.outline:hover{background:rgba(255,255,255,.1);}
  .btn.danger{background:var(--tab-db);color:#fff;}
  .btn.danger:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(239,71,112,.35);}
  .btn.small{font-size:.78rem;padding:7px 12px;border-radius:8px;}

  .breadcrumb{
    position:sticky;top:0;z-index:5;background:var(--paper-card);border-bottom:1px solid var(--line);
    padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    overflow-x:auto;
  }
  .crumb-trail{display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .crumb{background:none;border:none;color:var(--text-muted);font-size:.85rem;font-weight:500;
    cursor:pointer;padding:4px 6px;border-radius:6px;}
  .crumb:hover{color:var(--accent);background:rgba(91,95,239,.08);}
  .crumb.current{color:var(--text);font-weight:600;}
  .crumb-sep{color:var(--line);font-size:.85rem;}
  .code-pill{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-muted);
    background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap;
  }

  .container{max-width:960px;margin:0 auto;padding:22px 16px 90px;}
  .view{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .view-head{margin-bottom:16px;}
  .view-head h2{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;color:var(--text);}
  .muted{color:var(--text-muted);}
  .small{font-size:.85rem;}
  .subheading{font-family:'Space Grotesk',sans-serif;font-size:1rem;margin:22px 0 10px;color:var(--text);}

  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .tile{position:relative;background:var(--paper-card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;transition:transform .15s ease,box-shadow .15s ease;}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(18,20,43,.12);}
  .tile::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--tab-code);}
  .tile-ai::before{background:var(--tab-ai);}
  .tile-data::before{background:var(--tab-data);}
  .tile-struct::before{background:var(--tab-struct);}
  .tile-db::before{background:var(--tab-db);}
  .tile.tile-add::before{content:none;}
  .tile-body{display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%;
    background:none;border:none;padding:18px 14px 14px;cursor:pointer;text-align:left;font-family:inherit;}
  .tile-code{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--text-muted);letter-spacing:.03em;}
  .tile-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:1rem;color:var(--text);}
  .tile-meta{font-size:.76rem;color:var(--text-muted);}
  .tile-del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:none;
    background:rgba(18,20,43,.06);color:var(--text-muted);font-size:1rem;line-height:1;cursor:pointer;z-index:2;}
  .tile-del:hover{background:var(--tab-db);color:#fff;}
  .tile-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:1.5px dashed var(--line);background:transparent;box-shadow:none;color:var(--text-muted);
    font-weight:600;font-size:.85rem;min-height:96px;cursor:pointer;border-radius:var(--radius);width:100%;}
  .tile-add:hover{border-color:var(--accent);color:var(--accent);}
  .plus{font-size:1.3rem;}

  .material-list{background:var(--paper-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .material-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .material-row:last-child{border-bottom:none;}
  .material-open{flex:1;display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;
    cursor:pointer;text-align:left;min-width:0;}
  .mat-icon{font-size:1.4rem;flex-shrink:0;}
  .mat-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .mat-name{font-weight:600;font-size:.92rem;color:var(--text);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:56vw;}
  .mat-meta{font-size:.74rem;color:var(--text-muted);}
  .mat-del{background:none;border:none;font-size:1rem;color:var(--text-muted);cursor:pointer;
    padding:6px;border-radius:8px;flex-shrink:0;}
  .mat-del:hover{background:rgba(239,71,112,.1);color:var(--tab-db);}
  .btn-add-material{margin-top:14px;}

  .empty-state{text-align:center;padding:38px 20px;color:var(--text-muted);}
  .empty-icon{font-size:2rem;display:block;margin-bottom:10px;}
  .empty-title{font-weight:600;color:var(--text);margin:0 0 4px;}
  .empty-sub{font-size:.85rem;margin:0;}

  .modal-root{position:fixed;inset:0;display:none;z-index:50;}
  .modal-root.open{display:block;}
  .gate-overlay{position:fixed;inset:0;z-index:200;background:var(--ink);display:none;
    align-items:center;justify-content:center;padding:24px;}
  .gate-overlay.open{display:flex;}
  .gate-box{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  .gate-box .eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;
    font-size:.68rem;color:var(--text-muted);}
  .gate-box h2{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;margin:6px 0 4px;color:var(--text);}
  .gate-box p.sub{color:var(--text-muted);font-size:.88rem;margin-bottom:18px;}
  .gate-box .text-input{margin-bottom:6px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(18,20,43,.55);display:flex;
    align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.modal-overlay{align-items:center;padding:20px;}}
  .modal-box{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 26px;width:100%;
    max-width:420px;max-height:86vh;overflow-y:auto;}
  @media(min-width:640px){.modal-box{border-radius:18px;}}
  .modal-box h3{font-family:'Space Grotesk',sans-serif;margin:0 0 10px;font-size:1.12rem;}
  .field-label{display:block;font-size:.78rem;font-weight:600;color:var(--text-muted);margin:14px 0 6px;}
  .field-label:first-of-type{margin-top:2px;}
  .text-input,.file-input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:.95rem;font-family:inherit;background:var(--paper);color:var(--text);}
  .text-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;}
  .hint{font-size:.78rem;color:var(--text-muted);margin:8px 0 0;}
  .error-text{color:var(--tab-db);font-weight:600;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .shake{animation:shake .4s;}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .tab-switch{display:flex;gap:6px;background:var(--paper);padding:4px;border-radius:10px;margin-top:2px;}
  .tab-btn{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-weight:600;
    font-size:.84rem;color:var(--text-muted);cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(18,20,43,.12);}
  .visit-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;}
  .visit-row{padding:8px 12px;font-size:.8rem;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}
  .visit-row:last-child{border-bottom:none;}

  .toast-root{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;
    flex-direction:column;gap:8px;z-index:60;width:calc(100% - 32px);max-width:360px;align-items:center;}
  .toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.85rem;
    box-shadow:0 6px 20px rgba(18,20,43,.25);animation:toastIn .2s ease;text-align:center;}
  .toast.error{background:var(--tab-db);}
  .toast.success{background:var(--tab-data);}
  @keyframes toastIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="eyebrow">Personal Study Index</span>
        <h1>Sandeep Study Hub</h1>
      </div>
      <div class="header-actions">
        <span id="visits-badge" class="visits-badge" title="Total visits" style="display:none;">&#128065; <span id="visit-count">0</span></span>
        <button id="visits-btn" class="btn ghost small" data-action="admin-visits" style="display:none;color:#fff;">Visitor log</button>
        <button id="admin-btn" class="btn outline small" data-action="admin-toggle">Admin sign-in</button>
      </div>
    </div>
  </header>

  <nav id="breadcrumb" class="breadcrumb"></nav>
  <main id="main" class="container"></main>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root" class="modal-root"></div>
  <div id="visitor-gate" class="gate-overlay">
    <div class="gate-box">
      <span class="eyebrow">Sandeep Study Hub</span>
      <h2>Welcome &mdash; quick sign-in</h2>
      <p class="sub">Enter your email to continue. You&rsquo;ll only need to do this once on this device.</p>
      <input type="email" id="visitor-email-input" class="text-input" placeholder="you@example.com" autocomplete="email" />
      <p class="hint error-text" id="visitor-email-error" style="display:none;"></p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn primary" data-action="submit-visitor-email">Continue</button>
      </div>
    </div>
  </div>

<script type="module">
/*
  SETUP CHECKLIST (see chat for the full walkthrough)
  1) supabase.com/dashboard -> Sign up with email + password -> New project
  2) Authentication > Users > Add user (Auto Confirm ON)  -- this is YOUR admin login
  3) SQL Editor > run the table + policy SQL Claude gave you (swap in your admin email)
  4) Storage > New bucket named "materials", toggle Public ON, then run the storage policy SQL
  5) Project Settings > API -> copy Project URL and anon public key into SUPABASE_URL / SUPABASE_ANON_KEY below
  6) Rename this file to index.html and upload it to a GitHub repo, then Settings > Pages > enable
*/
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Paste your Supabase project's URL and anon/public key here (Project Settings -> API).
const SUPABASE_URL = "https://dkenkowfkeqrcahdiost.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_j7kUjqEocnFtSkca4Zxk4Q_0UrbSzEC";
const ADMIN_EMAIL = "sandeepsagara154@gmail.com"; // only this email counts as admin, even though visitors now sign in too
const SUPABASE_NOT_CONFIGURED = SUPABASE_URL.indexOf('PASTE_') === 0;

let supabase = null;
if(!SUPABASE_NOT_CONFIGURED){
  try{
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){ console.error('Supabase init failed', e); }
}

// Optional: Google Analytics for detailed visitor info (location, device, pages viewed).
// Get a free Measurement ID at analytics.google.com, then paste it below.
const GA_MEASUREMENT_ID = "G-GVDHQ3JC3P"; // looks like G-XXXXXXXXXX
if(GA_MEASUREMENT_ID.indexOf('PASTE_') !== 0){
  const gaScript = document.createElement('script');
  gaScript.async = true;
  gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
  document.head.appendChild(gaScript);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', GA_MEASUREMENT_ID);
}

/* ---------- config ---------- */
const MAX_FILE_BYTES = 20 * 1024 * 1024; // 20 MB per uploaded file
const VISITOR_EMAIL_KEY = 'shu_visitor_email';
const CAT_CODE = {
  'programming-languages':'PL',
  'artificial-intelligence':'AI',
  'data-science':'DS',
  'data-structures':'ST',
  'database':'DB'
};
const DEFAULT_TOPICS = ['Introduction','Program Structure','Syntax','Comments','Variables','Data Types','Constants','Input & Output','Operators'];
const DEFAULT_LANGS = ['C#','C++','JAVA','PYTHON','HTML','CSS','JAVASCRIPT'];

/* ---------- state ---------- */
let tree = null;
let state = { adminMode:false };
let visitCount = 0;
let visitLog = [];
let currentMaterialCtx = null;
let pendingNameSubmit = null;
let pendingConfirm = null;

/* ---------- supabase table + storage helpers ---------- */
async function fetchRow(key){
  const { data, error } = await supabase.from('kv_store').select('value').eq('key', key).maybeSingle();
  if(error){ console.error(error); return null; }
  return data ? data.value : null;
}
async function upsertRow(key, value){
  const { error } = await supabase.from('kv_store').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error){ console.error(error); return false; }
  return true;
}
async function loadTreeOnce(){
  let data = await fetchRow('tree');
  if(!data || !Array.isArray(data.categories)){
    data = buildDefaultTree();
    await upsertRow('tree', data);
  }
  tree = data;
  render();
}
function subscribeTree(){
  try{
    supabase.channel('kv-tree-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'kv_store', filter: 'key=eq.tree' }, function(payload){
        if(payload.new && payload.new.value && Array.isArray(payload.new.value.categories)){
          tree = payload.new.value;
          render();
        }
      })
      .subscribe();
  }catch(e){ /* realtime is optional — visitors can still refresh to see updates */ }
}
async function saveTree(t){
  tree = t;
  const ok = await upsertRow('tree', tree);
  if(!ok) showToast("Couldn't save — sign in as admin, or check your Supabase policies.", 'error');
  return ok;
}
function guessMimeType(filename){
  const ext = (filename.split('.').pop() || '').toLowerCase();
  const map = {
    pdf:'application/pdf', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
    webp:'image/webp', svg:'image/svg+xml', txt:'text/plain', md:'text/markdown',
    mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm',
    doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    ppt:'application/vnd.ms-powerpoint', pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
    xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    zip:'application/zip'
  };
  return map[ext] || 'application/octet-stream';
}
async function saveFileContent(id, file){
  const contentType = file.type || guessMimeType(file.name);
  const { error } = await supabase.storage.from('materials').upload(id, file, { upsert:false, contentType: contentType });
  if(error) throw error;
  const { data } = supabase.storage.from('materials').getPublicUrl(id);
  return data.publicUrl;
}
async function deleteFileContent(id){
  try{ await supabase.storage.from('materials').remove([id]); }catch(e){ /* already gone, ignore */ }
}
async function recordVisit(){
  try{
    let stats = await fetchRow('visits');
    if(!stats) stats = { count:0, log:[] };
    stats.count = (stats.count || 0) + 1;
    stats.log = stats.log || [];
    stats.log.unshift(new Date().toISOString());
    if(stats.log.length > 50) stats.log = stats.log.slice(0, 50);
    await upsertRow('visits', stats);
    return stats;
  }catch(e){
    console.error('visit record failed', e);
    return { count:0, log:[] };
  }
}

/* ---------- visitor email gate (simple, unverified) ---------- */
function getStoredVisitorEmail(){
  try{ return localStorage.getItem(VISITOR_EMAIL_KEY); }catch(e){ return null; }
}
function storeVisitorEmail(email){
  try{ localStorage.setItem(VISITOR_EMAIL_KEY, email); }catch(e){ /* ignore */ }
}
async function recordVisitorEmail(email){
  try{
    await supabase.from('visitor_emails').upsert(
      { email: email, last_seen_at: new Date().toISOString() },
      { onConflict: 'email' }
    );
  }catch(e){ console.error('visitor email record failed', e); }
}
async function fetchVisitorEmails(){
  try{
    const { data, error } = await supabase
      .from('visitor_emails')
      .select('email, first_seen_at, last_seen_at')
      .order('last_seen_at', { ascending: false })
      .limit(50);
    if(error){ console.error(error); return []; }
    return data || [];
  }catch(e){ return []; }
}
function showVisitorGate(){ document.getElementById('visitor-gate').classList.add('open'); }
function hideVisitorGate(){ document.getElementById('visitor-gate').classList.remove('open'); }
async function submitVisitorEmail(){
  const input = document.getElementById('visitor-email-input');
  const errEl = document.getElementById('visitor-email-error');
  const email = input.value.trim();
  errEl.style.display = 'none';
  if(!email){ errEl.textContent = 'Enter your email.'; errEl.style.display = 'block'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    errEl.textContent = "That doesn't look like a valid email.";
    errEl.style.display = 'block';
    return;
  }
  storeVisitorEmail(email);
  hideVisitorGate();
  recordVisitorEmail(email); // fire-and-forget, don't block the UI on this
  startApp();
}

/* ---------- default data ---------- */
function slugify(str){
  let s = String(str).trim();
  s = s.replace(/#/g,'sharp').replace(/\+/g,'p');
  s = s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return s || 'item';
}
function uniqueId(base, existingIds){
  let id = slugify(base);
  if(!existingIds.includes(id)) return id;
  let i = 2;
  while(existingIds.includes(id + '-' + i)) i++;
  return id + '-' + i;
}
function makeTopics(){
  return DEFAULT_TOPICS.map(name => ({ id: slugify(name), name, materials: [] }));
}
function pickColor(i){
  const palette = ['code','ai','data','struct','db'];
  return palette[i % palette.length];
}
function buildDefaultTree(){
  return {
    categories: [
      { id:'programming-languages', name:'Programming Languages', type:'nested', color:'code',
        languages: DEFAULT_LANGS.map(name => ({ id: slugify(name), name, topics: makeTopics() })) },
      { id:'artificial-intelligence', name:'Artificial Intelligence', type:'simple', color:'ai', materials:[], subfolders:[] },
      { id:'data-science', name:'Data Science', type:'simple', color:'data', materials:[], subfolders:[] },
      { id:'data-structures', name:'Data Structures', type:'simple', color:'struct', materials:[], subfolders:[] },
      { id:'database', name:'Database', type:'simple', color:'db', materials:[], subfolders:[] }
    ]
  };
}

/* ---------- lookups ---------- */
function getCategory(id){ return tree.categories.find(c => c.id === id); }
function getLanguage(cat, id){ return cat.languages.find(l => l.id === id); }
function getTopic(lang, id){ return lang.topics.find(t => t.id === id); }
function getSubfolder(cat, id){ return cat.subfolders.find(s => s.id === id); }
function getMaterialsArray(ctx){
  const cat = getCategory(ctx.catId);
  if(!cat) return null;
  if(ctx.topicId){
    const lang = getLanguage(cat, ctx.langId);
    const topic = lang && getTopic(lang, ctx.topicId);
    return topic ? topic.materials : null;
  }
  if(ctx.subId){
    const sub = getSubfolder(cat, ctx.subId);
    return sub ? sub.materials : null;
  }
  return cat.materials || null;
}
function readCtx(el){
  return { catId: el.dataset.cat, langId: el.dataset.lang, topicId: el.dataset.topic, subId: el.dataset.sub, matId: el.dataset.mat };
}

/* ---------- catalog codes ---------- */
function catCode(cat){
  if(CAT_CODE[cat.id]) return CAT_CODE[cat.id];
  const words = cat.name.split(/\s+/).filter(Boolean);
  let code = words.map(w => w[0]).join('').toUpperCase().slice(0,3);
  return code || 'XX';
}
function shortCode(name, len){
  len = len || 4;
  const clean = String(name).replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  return clean.slice(0, len) || 'XX';
}
function langCode(cat, lang){ return catCode(cat) + '\u00b7' + shortCode(lang.name); }
function topicCode(cat, lang, topic, idx){ return langCode(cat, lang) + '\u00b7' + String(idx+1).padStart(2,'0'); }
function subCode(cat, sub){ return catCode(cat) + '\u00b7' + shortCode(sub.name); }

/* ---------- formatting ---------- */
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatBytes(bytes){
  if(bytes == null) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}
function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });
  }catch(e){ return iso; }
}
function iconForMaterial(m){
  if(m.kind === 'link'){
    if(/youtube\.com|youtu\.be|vimeo\.com/i.test(m.url)) return '\ud83c\udfac';
    return '\ud83d\udd17';
  }
  const ext = (m.ext || '').toLowerCase();
  if(ext === 'pdf') return '\ud83d\udcd5';
  if(['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '\ud83d\uddbc\ufe0f';
  if(['mp4','mov','avi','mkv','webm'].includes(ext)) return '\ud83c\udfac';
  if(['doc','docx'].includes(ext)) return '\ud83d\udcdd';
  if(['ppt','pptx'].includes(ext)) return '\ud83d\udcca';
  if(['xls','xlsx','csv'].includes(ext)) return '\ud83d\udcc8';
  if(['zip','rar','7z'].includes(ext)) return '\ud83d\uddDC\ufe0f';
  if(['txt','md'].includes(ext)) return '\ud83d\udcc4';
  return '\ud83d\udcc1';
}

/* ---------- toast ---------- */

  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? (' ' + type) : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, 2400);
}

function collectFileIds(node){
  let ids = [];
  if(!node) return ids;
  if(Array.isArray(node.materials)) node.materials.forEach(m => { if(m.kind === 'file') ids.push(m.id); });
  if(Array.isArray(node.topics)) node.topics.forEach(t => { ids = ids.concat(collectFileIds(t)); });
  if(Array.isArray(node.languages)) node.languages.forEach(l => { ids = ids.concat(collectFileIds(l)); });
  if(Array.isArray(node.subfolders)) node.subfolders.forEach(s => { ids = ids.concat(collectFileIds(s)); });
  return ids;
}
async function cascadeDeleteFiles(node){
  const ids = collectFileIds(node);
  for(const id of ids){ await deleteFileContent(id); }
}

async function submitMaterial(){
  const ctx = currentMaterialCtx;
  if(!ctx) return;
  const materials = getMaterialsArray(ctx);
  if(!materials){ showToast('Could not find this folder.', 'error'); return; }
  const activeBtn = document.querySelector('.tab-btn.active');
  const activeTab = activeBtn ? activeBtn.dataset.tab : 'file';

  if(activeTab === 'file'){
    const input = document.getElementById('material-file-input');
    const file = input && input.files && input.files[0];
    const errEl = document.getElementById('material-error');
    errEl.style.display = 'none';
    if(!file){ errEl.textContent = 'Choose a file first.'; errEl.style.display = 'block'; return; }
    if(file.size > MAX_FILE_BYTES){
      errEl.textContent = 'That file is ' + formatBytes(file.size) + ' \u2014 over the ' + formatBytes(MAX_FILE_BYTES) + ' limit. Switch to Add link instead.';
      errEl.style.display = 'block';
      return;
    }
    const saveBtn = document.getElementById('material-save-btn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
    try{
      const id = 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const url = await saveFileContent(id, file);
      materials.push({ id, name:file.name, kind:'file', url, ext:(file.name.split('.').pop() || '').toLowerCase(), mime:file.type || '', size:file.size, addedAt:new Date().toISOString() });
      await saveTree(tree);
      closeModal();
      showToast('Added.', 'success');
      render();
    }catch(err){
      console.error(err);
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      errEl.textContent = "Couldn't save that file \u2014 try again, or add it as a link instead.";
      errEl.style.display = 'block';
    }
  } else {
    const titleInput = document.getElementById('material-link-title');
    const urlInput = document.getElementById('material-link-url');
    const errEl = document.getElementById('material-link-error');
    errEl.style.display = 'none';
    const title = titleInput.value.trim();
    let url = urlInput.value.trim();
    if(!title){ errEl.textContent = 'Give it a title.'; errEl.style.display = 'block'; return; }
    if(!url){ errEl.textContent = 'Paste a link.'; errEl.style.display = 'block'; return; }
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try{ new URL(url); }catch(e){ errEl.textContent = "That link doesn't look right."; errEl.style.display = 'block'; return; }
    materials.push({ id:'m-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7), name:title, kind:'link', url, addedAt:new Date().toISOString() });
    await saveTree(tree);
    closeModal();
    showToast('Added.', 'success');
    render();
  }
}
const OFFICE_EXTS = ['doc','docx','ppt','pptx','xls','xlsx'];
function viewerUrlFor(m){
  if(m.kind === 'file' && OFFICE_EXTS.includes((m.ext || '').toLowerCase())){
    return 'https://docs.google.com/viewer?url=' + encodeURIComponent(m.url) + '&embedded=true';
  }
  return m.url;
}
function openMaterialItem(ctx){
  const materials = getMaterialsArray(ctx);
  const m = materials && materials.find(x => x.id === ctx.matId);
  if(!m || !m.url) return;
  recordMaterialDownload(m.id); // fire-and-forget, don't block opening the material
  window.open(viewerUrlFor(m), '_blank', 'noopener');
}
async function recordMaterialDownload(materialId){
  try{
    const { data } = await supabase.from('material_downloads').select('download_count').eq('material_id', materialId).maybeSingle();
    const nextCount = (data && data.download_count ? data.download_count : 0) + 1;
    await supabase.from('material_downloads').upsert(
      { material_id: materialId, download_count: nextCount, last_downloaded_at: new Date().toISOString() },
      { onConflict: 'material_id' }
    );
  }catch(e){ console.error('download count failed', e); }
}
async function fetchMaterialDownloads(){
  try{
    const { data, error } = await supabase
      .from('material_downloads')
      .select('material_id, download_count, last_downloaded_at')
      .order('download_count', { ascending: false })
      .limit(50);
    if(error){ console.error(error); return []; }
    return data || [];
  }catch(e){ return []; }
}
function findMaterialLabel(materialId){
  for(const cat of tree.categories){
    if(cat.type === 'nested'){
      for(const lang of cat.languages){
        for(const topic of lang.topics){
          const m = topic.materials.find(function(x){ return x.id === materialId; });
          if(m) return cat.name + ' \u203a ' + lang.name + ' \u203a ' + topic.name + ' \u2014 ' + m.name;
        }
      }
    } else {
      const mRoot = cat.materials.find(function(x){ return x.id === materialId; });
      if(mRoot) return cat.name + ' \u2014 ' + mRoot.name;
      for(const sub of cat.subfolders){
        const mSub = sub.materials.find(function(x){ return x.id === materialId; });
        if(mSub) return cat.name + ' \u203a ' + sub.name + ' \u2014 ' + mSub.name;
      }
    }
  }
  return '(deleted material)';
}

        '<h3 style="margin-top:18px;">App installs (<strong>' + installs.length + '</strong>)</h3>' +
        '<div class="visit-list">' + installRows + '</div>' +
        '<p class="hint">Emails are self-reported at sign-in (not verified). App-install tracking only works on Android/Chrome \u2014 iPhone Safari doesn\u2019t report installs to websites. This whole panel is private to your admin login.</p>' +
        '<div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div>' +
      '</div>' +
    '</div>'
  );
}

/* ---------- rendering ---------- */
function tileHtml(opts){
  const delBtn = opts.deleteAction
    ? '<button class="tile-del" data-action="' + opts.deleteAction + '" ' + opts.deleteData + ' title="Delete" aria-label="Delete ' + escapeHtml(opts.title) + '">&times;</button>'
    : '';
  return (
    '<div class="tile tile-' + opts.colorClass + '">' +
      delBtn +
      '<button class="tile-body" data-action="nav" data-nav="' + opts.href + '">' +
        '<span class="tile-code">' + escapeHtml(opts.code) + '</span>' +
        '<span class="tile-title">' + escapeHtml(opts.title) + '</span>' +
        '<span class="tile-meta">' + escapeHtml(opts.meta) + '</span>' +
      '</button>' +
    '</div>'
  );
}
function emptyStateHtml(title, sub){
  return (
    '<div class="empty-state">' +
      '<span class="empty-icon">\ud83d\uddc2\ufe0f</span>' +
      '<p class="empty-title">' + escapeHtml(title) + '</p>' +
      (sub ? '<p class="empty-sub">' + escapeHtml(sub) + '</p>' : '') +
    '</div>'
  );
}
function materialListHtml(materials, ctxAttrs){
  if(materials.length === 0){
    return emptyStateHtml('No material here yet.', state.adminMode ? 'Add the first file or link below.' : 'Check back soon.');
  }
  return '<div class="material-list">' + materials.map(function(m){
    const icon = iconForMaterial(m);
    const metaText = m.kind === 'file' ? ((m.ext || 'file').toUpperCase() + ' \u00b7 ' + formatBytes(m.size)) : 'Link';
    const delBtn = state.adminMode
      ? '<button class="mat-del" data-action="delete-material" ' + ctxAttrs + ' data-mat="' + m.id + '" title="Delete" aria-label="Delete ' + escapeHtml(m.name) + '">\ud83d\uddd1</button>'
      : '';
    return (
      '<div class="material-row">' +
        '<button class="material-open" data-action="open-material" ' + ctxAttrs + ' data-mat="' + m.id + '">' +
          '<span class="mat-icon">' + icon + '</span>' +
          '<span class="mat-info"><span class="mat-name">' + escapeHtml(m.name) + '</span>' +
          '<span class="mat-meta">' + escapeHtml(metaText) + ' \u00b7 ' + escapeHtml(formatDate(m.addedAt)) + '</span></span>' +
        '</button>' +
        delBtn +
      '</div>'
    );
  }).join('') + '</div>';
}

function renderBreadcrumb(path){
  const bc = document.getElementById('breadcrumb');
  let crumbs = ['<button class="crumb" data-action="nav" data-nav="">Home</button>'];
  let accum = [];
  let code = 'SSH';
  if(path[0]){
    const cat = getCategory(path[0]);
    if(cat){
      accum.push(cat.id);
      crumbs.push('<span class="crumb-sep">\u203a</span><button class="crumb" data-action="nav" data-nav="' + accum.join('/') + '">' + escapeHtml(cat.name) + '</button>');
      code = catCode(cat);
      if(path[1]){
        if(cat.type === 'nested'){
          const lang = getLanguage(cat, path[1]);
          if(lang){
            accum.push(lang.id);
            crumbs.push('<span class="crumb-sep">\u203a</span><button class="crumb" data-action="nav" data-nav="' + accum.join('/') + '">' + escapeHtml(lang.name) + '</button>');
            code = langCode(cat, lang);
            if(path[2]){
              const ti = lang.topics.findIndex(function(t){ return t.id === path[2]; });
              const topic = lang.topics[ti];
              if(topic){
                crumbs.push('<span class="crumb-sep">\u203a</span><span class="crumb current">' + escapeHtml(topic.name) + '</span>');
                code = topicCode(cat, lang, topic, ti);
              }
            }
          }
        } else {
          const sub = getSubfolder(cat, path[1]);
          if(sub){
            crumbs.push('<span class="crumb-sep">\u203a</span><span class="crumb current">' + escapeHtml(sub.name) + '</span>');
            code = subCode(cat, sub);
          }
        }
      }
    }
  }
  bc.innerHTML = '<div class="crumb-trail">' + crumbs.join('') + '</div><span class="code-pill">' + escapeHtml(code) + '</span>';
}

function renderHome(main){
  document.title = 'Sandeep Study Hub';
  const cards = tree.categories.map(function(cat){
    const metaLabel = cat.type === 'nested'
      ? cat.languages.length + ' language' + (cat.languages.length === 1 ? '' : 's')
      : (cat.materials.length + ' files \u00b7 ' + cat.subfolders.length + ' subfolders');
    return tileHtml({ href: cat.id, colorClass: cat.color, code: catCode(cat), title: cat.name, meta: metaLabel,
      deleteAction: state.adminMode ? 'delete-category' : null, deleteData: 'data-cat="' + cat.id + '"' });
  }).join('');
  const addTile = state.adminMode ? '<button class="tile tile-add" data-action="add-category"><span class="plus">+</span><span>Add section</span></button>' : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>All sections</h2><p class="muted small">Everything you\u2019re learning, in one place.</p></div>' +
      '<div class="tile-grid">' + cards + addTile + '</div>' +
    '</div>';
}
function renderLanguagesGrid(main, cat){
  document.title = cat.name + ' \u2014 Sandeep Study Hub';
  const cards = cat.languages.map(function(lang){
    const withMaterial = lang.topics.filter(function(t){ return t.materials.length > 0; }).length;
    return tileHtml({ href: cat.id + '/' + lang.id, colorClass: cat.color, code: langCode(cat, lang), title: lang.name,
      meta: lang.topics.length + ' topics \u00b7 ' + withMaterial + ' with material',
      deleteAction: state.adminMode ? 'delete-language' : null, deleteData: 'data-cat="' + cat.id + '" data-lang="' + lang.id + '"' });
  }).join('');
  const addTile = state.adminMode ? '<button class="tile tile-add" data-action="add-language" data-cat="' + cat.id + '"><span class="plus">+</span><span>Add language</span></button>' : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>' + escapeHtml(cat.name) + '</h2><p class="muted small">Pick a language to open its notes.</p></div>' +
      '<div class="tile-grid">' + cards + addTile + '</div>' +
    '</div>';
}
function renderTopicsGrid(main, cat, lang){
  document.title = lang.name + ' \u2014 Sandeep Study Hub';
  const cards = lang.topics.map(function(topic, idx){
    return tileHtml({ href: cat.id + '/' + lang.id + '/' + topic.id, colorClass: cat.color, code: topicCode(cat, lang, topic, idx), title: topic.name,
      meta: topic.materials.length + ' item' + (topic.materials.length === 1 ? '' : 's'),
      deleteAction: state.adminMode ? 'delete-topic' : null, deleteData: 'data-cat="' + cat.id + '" data-lang="' + lang.id + '" data-topic="' + topic.id + '"' });
  }).join('');
  const addTile = state.adminMode ? '<button class="tile tile-add" data-action="add-topic" data-cat="' + cat.id + '" data-lang="' + lang.id + '"><span class="plus">+</span><span>Add topic</span></button>' : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>' + escapeHtml(lang.name) + '</h2><p class="muted small">' + escapeHtml(cat.name) + '</p></div>' +
      '<div class="tile-grid">' + cards + addTile + '</div>' +
    '</div>';
}
function renderTopicMaterials(main, cat, lang, topic){
  document.title = topic.name + ' \u2014 ' + lang.name + ' \u2014 Sandeep Study Hub';
  const ctxAttrs = 'data-cat="' + cat.id + '" data-lang="' + lang.id + '" data-topic="' + topic.id + '"';
  const addBtn = state.adminMode ? '<button class="btn primary btn-add-material" data-action="add-material" ' + ctxAttrs + '>+ Add material</button>' : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>' + escapeHtml(topic.name) + '</h2><p class="muted small">' + escapeHtml(cat.name) + ' \u00b7 ' + escapeHtml(lang.name) + '</p></div>' +
      materialListHtml(topic.materials, ctxAttrs) +
      addBtn +
    '</div>';
}
function renderSimpleRoot(main, cat){
  document.title = cat.name + ' \u2014 Sandeep Study Hub';
  const ctxAttrs = 'data-cat="' + cat.id + '"';
  const subCards = cat.subfolders.map(function(sub){
    return tileHtml({ href: cat.id + '/' + sub.id, colorClass: cat.color, code: subCode(cat, sub), title: sub.name,
      meta: sub.materials.length + ' item' + (sub.materials.length === 1 ? '' : 's'),
      deleteAction: state.adminMode ? 'delete-subfolder' : null, deleteData: 'data-cat="' + cat.id + '" data-sub="' + sub.id + '"' });
  }).join('');
  const addSubTile = state.adminMode ? '<button class="tile tile-add" data-action="add-subfolder" data-cat="' + cat.id + '"><span class="plus">+</span><span>Add subfolder</span></button>' : '';
  const addMatBtn = state.adminMode ? '<button class="btn primary btn-add-material" data-action="add-material" ' + ctxAttrs + '>+ Add material</button>' : '';
  const subSection = (cat.subfolders.length > 0 || state.adminMode)
    ? '<div class="subsection"><h3 class="subheading">Subfolders</h3><div class="tile-grid">' + subCards + addSubTile + '</div></div>'
    : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>' + escapeHtml(cat.name) + '</h2><p class="muted small">Upload here directly, or use a subfolder to keep things tidy.</p></div>' +
      subSection +
      '<h3 class="subheading">Files &amp; links</h3>' +
      materialListHtml(cat.materials, ctxAttrs) +
      addMatBtn +
    '</div>';
}
function renderSimpleSubfolder(main, cat, sub){
  document.title = sub.name + ' \u2014 Sandeep Study Hub';
  const ctxAttrs = 'data-cat="' + cat.id + '" data-sub="' + sub.id + '"';
  const addBtn = state.adminMode ? '<button class="btn primary btn-add-material" data-action="add-material" ' + ctxAttrs + '>+ Add material</button>' : '';
  main.innerHTML =
    '<div class="view">' +
      '<div class="view-head"><h2>' + escapeHtml(sub.name) + '</h2><p class="muted small">' + escapeHtml(cat.name) + '</p></div>' +
      materialListHtml(sub.materials, ctxAttrs) +
      addBtn +
    '</div>';
}
function renderNotFound(main){
  main.innerHTML =
    '<div class="view">' +
      '<div class="empty-state">' +
        '<span class="empty-icon">\ud83e\udded</span>' +
        '<p class="empty-title">That folder isn\u2019t here.</p>' +
        '<p class="empty-sub">It may have been deleted.</p>' +
        '<br/><button class="btn primary" data-action="nav" data-nav="">Go home</button>' +
      '</div>' +
    '</div>';
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return [];
  return h.split('/').map(decodeURIComponent).filter(Boolean);
}
function goTo(pathStr){
  const target = '#/' + pathStr;
  if(location.hash === target){ render(); } else { location.hash = target; }
}
function render(){
  const main = document.getElementById('main');
  if(!tree){
    main.innerHTML = '<div class="view"><div class="empty-state"><span class="empty-icon">\u23f3</span><p class="empty-title">Loading\u2026</p></div></div>';
    return;
  }
  const path = parseHash();
  renderBreadcrumb(path);
  if(path.length === 0){ renderHome(main); return; }
  const cat = getCategory(path[0]);
  if(!cat){ renderNotFound(main); return; }
  if(cat.type === 'nested'){
    if(path.length === 1){ renderLanguagesGrid(main, cat); return; }
    const lang = getLanguage(cat, path[1]);
    if(!lang){ renderNotFound(main); return; }
    if(path.length === 2){ renderTopicsGrid(main, cat, lang); return; }
    const topic = getTopic(lang, path[2]);
    if(!topic){ renderNotFound(main); return; }
    renderTopicMaterials(main, cat, lang, topic);
  } else {
    if(path.length === 1){ renderSimpleRoot(main, cat); return; }
    const sub = getSubfolder(cat, path[1]);
    if(!sub){ renderNotFound(main); return; }
    renderSimpleSubfolder(main, cat, sub);
  }
}

/* ---------- global event delegation ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'noop') return;
  if(action === 'close-modal'){ closeModal(); return; }
  if(action === 'nav'){ goTo(el.dataset.nav || ''); return; }
  if(action === 'admin-toggle'){ handleAdminToggle(); return; }
  if(action === 'admin-visits'){ openVisitsModal(); return; }
  if(action === 'add-category'){ openAddCategoryModal(); return; }
  if(action === 'add-language'){ openAddLanguageModal(el.dataset.cat); return; }
  if(action === 'add-topic'){ openAddTopicModal(el.dataset.cat, el.dataset.lang); return; }
  if(action === 'add-subfolder'){ openAddSubfolderModal(el.dataset.cat); return; }
  if(action === 'add-material'){ openMaterialModal(readCtx(el)); return; }
  if(action === 'open-material'){ openMaterialItem(readCtx(el)); return; }
  if(action === 'delete-category'){ confirmDeleteCategory(el.dataset.cat); return; }
  if(action === 'delete-language'){ confirmDeleteLanguage(el.dataset.cat, el.dataset.lang); return; }
  if(action === 'delete-topic'){ confirmDeleteTopic(el.dataset.cat, el.dataset.lang, el.dataset.topic); return; }
  if(action === 'delete-subfolder'){ confirmDeleteSubfolder(el.dataset.cat, el.dataset.sub); return; }
  if(action === 'delete-material'){ confirmDeleteMaterial(readCtx(el)); return; }
  if(action === 'submit-name'){ const v = (document.getElementById('modal-input') || {}).value || ''; if(pendingNameSubmit) pendingNameSubmit(v.trim()); return; }
  if(action === 'submit-material'){ submitMaterial(); return; }
  if(action === 'submit-password'){ submitPassword(); return; }
  if(action === 'submit-confirm'){ if(pendingConfirm) pendingConfirm(); return; }
  if(action === 'switch-tab'){ switchMaterialTab(el.dataset.tab); return; }
  if(action === 'submit-visitor-email'){ submitVisitorEmail(); return; }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key === 'Enter'){
    if(e.target && e.target.id === 'modal-input'){ e.preventDefault(); if(pendingNameSubmit) pendingNameSubmit(e.target.value.trim()); }
    else if(e.target && (e.target.id === 'admin-email-input' || e.target.id === 'admin-password-input')){ e.preventDefault(); submitPassword(); }
    else if(e.target && e.target.id === 'visitor-email-input'){ e.preventDefault(); submitVisitorEmail(); }
  }
});
window.addEventListener('hashchange', render);

/* ---------- install as an app ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline install just won't be available */ });
  });
}
window.addEventListener('appinstalled', function(){
  recordAppInstall();
});
async function recordAppInstall(){
  if(!supabase) return;
  try{
    const email = getStoredVisitorEmail();
    await supabase.from('app_installs').insert({ email: email || null });
  }catch(e){ console.error('app install record failed', e); }
}
async function fetchAppInstalls(){
  try{
    const { data, error } = await supabase
      .from('app_installs')
      .select('email, installed_at')
      .order('installed_at', { ascending: false })
      .limit(50);
    if(error){ console.error(error); return []; }
    return data || [];
  }catch(e){ return []; }
}

/* ---------- init ---------- */
async function startApp(){
  if(SUPABASE_NOT_CONFIGURED){
    document.getElementById('main').innerHTML =
      '<div class="view"><div class="empty-state">' +
        '<span class="empty-icon">\ud83d\udd27</span>' +
        '<p class="empty-title">Almost there \u2014 add your Supabase details</p>' +
        '<p class="empty-sub">Open this file, find the SUPABASE_URL / SUPABASE_ANON_KEY lines near the top of the script, and paste in the values from your Supabase project\u2019s API settings.</p>' +
      '</div></div>';
    return;
  }
  supabase.auth.onAuthStateChange(function(event, session){
    state.adminMode = !!(session && session.user && session.user.email === ADMIN_EMAIL);
    updateAdminUI();
    render();
  });
  await loadTreeOnce();
  subscribeTree();
  let sessionAlreadyRecorded = false;
  try{ sessionAlreadyRecorded = sessionStorage.getItem('shu_visit_recorded') === '1'; }catch(e){ /* ignore */ }
  let stats;
  if(sessionAlreadyRecorded){
    stats = await fetchRow('visits');
    if(!stats) stats = { count:0, log:[] };
  } else {
    stats = await recordVisit();
    try{ sessionStorage.setItem('shu_visit_recorded', '1'); }catch(e){ /* ignore */ }
  }
  visitCount = stats.count;
  visitLog = stats.log;
  const vc = document.getElementById('visit-count');
  if(vc) vc.textContent = visitCount;
  render();
}
function init(){
  const storedEmail = getStoredVisitorEmail();
  if(storedEmail){
    startApp();
  } else {
    showVisitorGate();
    setTimeout(function(){ const i = document.getElementById('visitor-email-input'); if(i) i.focus(); }, 30);
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
